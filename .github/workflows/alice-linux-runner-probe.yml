name: Alice Linux JIT runner probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, alice-core]
    timeout-minutes: 10
    steps:
      - name: Verify repo-scoped Linux JIT runner
        shell: bash
        run: |
          set -euo pipefail
          echo "repository=$GITHUB_REPOSITORY"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          node --version
          uname -a
          df -h .

          test "$GITHUB_REPOSITORY" = "clockcrockwork/Interactive-alice"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          case "$RUNNER_NAME" in
            cloud-run-*) ;;
            *)
              echo "::error::unexpected runner name: $RUNNER_NAME"
              exit 1
              ;;
          esac
