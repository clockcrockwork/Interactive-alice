name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository:
    name: repository checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-text.py
      - run: python3 scripts/check-experience.py
      - run: python3 scripts/check-frontend.py
      - name: the pacing fixture still matches the reference
        run: |
          python3 scripts/show-scene.py rabbit-hole --plan --json > tests/fixtures/rabbit-hole.plan.json
          git diff --exit-code -- tests/fixtures/rabbit-hole.plan.json

  frontend:
    name: lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: look for a front end
        id: probe
        run: echo "exists=${{ hashFiles('package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.probe.outputs.exists == 'true'
        run: npm ci
      - if: steps.probe.outputs.exists == 'true'
        run: npm run lint
      - if: steps.probe.outputs.exists == 'true'
        run: npm run typecheck
      - if: steps.probe.outputs.exists == 'true'
        run: npm run build
      - if: steps.probe.outputs.exists == 'true'
        run: npm test
      - if: steps.probe.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.probe.outputs.exists == 'true'
        run: npm run test:e2e
