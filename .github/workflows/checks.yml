name: checks

on:
  pull_request:
  push:
    branches: [main]

# Private-repository checks run on the repo-scoped Linux JIT plane so routine PR/main
# validation does not consume GitHub-hosted included minutes. There is intentionally
# no ubuntu-latest fallback: if the JIT plane is unavailable, the checks stay queued.

jobs:
  repository:
    name: repository checkers
    runs-on: [self-hosted, linux, x64, alice-core]
    steps:
      - uses: actions/checkout@v4
      # Node, because the checkers are launched through build/python.mjs, which finds
      # the interpreter by name rather than assuming one. No npm install is needed:
      # the checkers and the launcher have no dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run check:data
      - name: the pacing fixture still matches the reference, for every scene
        run: |
          npm run plan:fixture
          git diff --exit-code -- tests/fixtures/plans.json

  frontend:
    name: lint, typecheck, build, test
    runs-on: [self-hosted, linux, x64, alice-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: types still match the schemas
        run: |
          npm run types:schema
          git diff --exit-code -- src/types/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: build, and record the size report
        run: npm run build
      - name: Verify the pre-baked Playwright runtime
        run: |
          set -euo pipefail
          test -d /ms-playwright
          npx playwright --version
          test "$(npx playwright --version)" = "Version 1.63.0"
      - run: npm run test:e2e
