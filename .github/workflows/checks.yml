name: checks

on:
  pull_request:
  push:
    branches: [main]

# Note: GitHub-hosted runner minutes for this account are exhausted for September
# 2026, so these jobs cannot start until the allowance resets. Until then the gate
# is the same set of commands run locally; see docs/deployment.md §4.

jobs:
  repository:
    name: repository checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-text.py
      - run: python3 scripts/check-experience.py
      - run: python3 scripts/check-frontend.py
      - name: the pacing fixture still matches the reference, for every scene
        run: |
          python3 scripts/show-scene.py --all --plan --json > tests/fixtures/plans.json
          git diff --exit-code -- tests/fixtures/plans.json

  frontend:
    name: lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: types still match the schemas
        run: |
          npm run types:schema
          git diff --exit-code -- src/types/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: build, and record the size report
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
