<h1>落下原画・腕分離の比較候補</h1>
<p>未採用・静止比較です。分離生成は元の座標・大きさ・輪郭を厳密には保っていません。右の配置は CSS による仮置きであり、画像の修正や可動リグの完成ではありません。袖の接合、腕の太さ、指、顔と髪の変化を確認してください。瓶のアンカーや動きには接続していません。</p>
